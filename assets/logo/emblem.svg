<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="نشان مزه کباب">
  <defs>
    <linearGradient id="mk-flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0BC4F"/>
      <stop offset="1" stop-color="#C2571F"/>
    </linearGradient>
    <linearGradient id="mk-meat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5A33"/>
      <stop offset="1" stop-color="#5A391D"/>
    </linearGradient>
  </defs>

  <!-- rings: outer + beaded tile-like ring -->
  <circle cx="48" cy="48" r="46" fill="none" stroke="#D8B36A" stroke-width="1.6"/>
  <circle cx="48" cy="48" r="41.5" fill="none" stroke="#D8B36A" stroke-width="0.9"
          stroke-dasharray="0.4 4.7" stroke-linecap="round" opacity="0.9"/>

  <!-- iwan arch (Persian gateway) -->
  <path d="M26 78 V48 C26 32.5 37 24.5 48 20.5 C59 24.5 70 32.5 70 48 V78"
        fill="none" stroke="#D8B36A" stroke-width="1.1" opacity="0.9"/>
  <path d="M21.5 78 H74.5 M21.5 78 V75 M74.5 78 V75" fill="none" stroke="#D8B36A" stroke-width="1.1"/>

  <!-- flame -->
  <path d="M48 24 C51.2 28.4 54.6 31.9 54.6 36.1 A6.6 6.6 0 1 1 41.4 36.1 C41.4 31.9 44.8 28.4 48 24 Z"
        fill="url(#mk-flame)"/>
  <path d="M48 30.6 C50 33.1 51.9 35 51.9 37.3 A3.9 3.9 0 1 1 44.1 37.3 C44.1 35 46 33.1 48 30.6 Z"
        fill="#F6D98F" opacity="0.95"/>

  <!-- sparkles -->
  <path d="M33.8 26.8 L34.6 29.5 L37.3 30.3 L34.6 31.1 L33.8 33.8 L33 31.1 L30.3 30.3 L33 29.5 Z" fill="#E3B04B"/>
  <path d="M62.2 26.8 L63 29.5 L65.7 30.3 L63 31.1 L62.2 33.8 L61.4 31.1 L58.7 30.3 L61.4 29.5 Z" fill="#E3B04B"/>

  <!-- skewer -->
  <line x1="48" y1="43.5" x2="48" y2="71.5" stroke="#C9A45E" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M48 75.8 L45.9 71.8 H50.1 Z" fill="#C9A45E"/>

  <!-- kebab pieces -->
  <g stroke="#40260F" stroke-width="0.6">
    <rect x="38"   y="40"   width="20"   height="10"   rx="5"   fill="url(#mk-meat)"/>
    <rect x="36.8" y="51.6" width="22.4" height="10.4" rx="5"   fill="url(#mk-meat)"/>
    <rect x="38.4" y="63.6" width="19.2" height="9.4"  rx="4.7" fill="url(#mk-meat)"/>
  </g>
  <g stroke="#3F2410" stroke-width="0.9" stroke-linecap="round" opacity="0.55">
    <path d="M42.5 45.2 H53.5"/>
    <path d="M41.5 56.8 H54.5"/>
    <path d="M43 68.3 H53"/>
  </g>

  <!-- pomegranates (fruit of Qazvin) -->
  <g fill="#A6433C">
    <circle cx="30.8" cy="74.3" r="2.2"/>
    <circle cx="65.2" cy="74.3" r="2.2"/>
  </g>
  <g fill="none" stroke="#A6433C" stroke-width="0.8" stroke-linecap="round">
    <path d="M29.7 72.5 L30.8 71 L31.9 72.5"/>
    <path d="M64.1 72.5 L65.2 71 L66.3 72.5"/>
  </g>
</svg>
